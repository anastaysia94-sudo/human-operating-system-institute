name: HOSI-101 Lessons 01-20 QA

on:
  pull_request:
    paths:
      - 'courses/HOSI-101/**'
      - 'research/HOSI101_Lessons_01-20_*'
      - 'review/HOSI101_01-20_HUMAN_REVIEW_PACKET.md'
      - 'scripts/validate_hosi101_01_20.py'
      - '.github/workflows/hosi101-lessons-01-20-qa.yml'
      - 'STATUS.md'
  push:
    branches:
      - main
    paths:
      - 'courses/HOSI-101/**'
      - 'research/HOSI101_Lessons_01-20_*'
      - 'review/HOSI101_01-20_HUMAN_REVIEW_PACKET.md'
      - 'scripts/validate_hosi101_01_20.py'
      - '.github/workflows/hosi101-lessons-01-20-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-lessons-01-20:
    name: Validate canonical Lessons 001-020
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run deterministic Lessons 001-020 QA
        run: python scripts/validate_hosi101_01_20.py
