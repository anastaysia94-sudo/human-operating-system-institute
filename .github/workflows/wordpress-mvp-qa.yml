name: HOSI WordPress MVP QA

on:
  pull_request:
    paths:
      - 'platform/wordpress-mvp/**'
      - 'platform/web/mvp/**'
      - 'scripts/validate_wordpress_mvp.py'
      - '.github/workflows/wordpress-mvp-qa.yml'
  push:
    branches:
      - main
    paths:
      - 'platform/wordpress-mvp/**'
      - 'platform/web/mvp/**'
      - 'scripts/validate_wordpress_mvp.py'
      - '.github/workflows/wordpress-mvp-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-wordpress-mvp:
    name: Validate WordPress campus blueprint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run deterministic WordPress MVP QA
        run: python scripts/validate_wordpress_mvp.py
